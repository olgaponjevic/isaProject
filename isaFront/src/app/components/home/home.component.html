<div class="home-container">

  <header class="navbar">
    <h1 class="logo">Jutjubić</h1>
    <div class="nav-actions" *ngIf="authService.isLoggedIn()">
      <span class="user-info">Pozdrav, {{ authService.getUsername() }}!</span>
      <a routerLink="/upload" class="btn-primary">+ Novi video</a>
      <button (click)="logout()" class="btn-secondary">Odjavi se</button>
    </div>
    <div class="nav-actions" *ngIf="!authService.isLoggedIn()">
      <a routerLink="/login" class="btn-primary">Prijavi se</a>
      <a routerLink="/register" class="btn-secondary">Registruj se</a>
    </div>
  </header>

  <main class="content">

    <h2>Svi videi</h2>

    <div *ngIf="loading" class="info-message">
      Učitavanje videa...
    </div>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <div *ngIf="!loading && videos.length === 0" class="info-message">
      Još nema videa.
    </div>

    <div class="video-grid" *ngIf="!loading && videos.length > 0">
      <div class="video-card" *ngFor="let video of videos">
        <img
          [src]="apiBaseUrl + video.thumbnailUrl"
          [alt]="video.title"
          class="thumbnail"
          [routerLink]="['/video', video.id]"
        />
        <div class="video-info">
          <h3 [routerLink]="['/video', video.id]">{{ video.title }}</h3>
          <a [routerLink]="['/profile', video.authorId]" class="author">{{ video.authorUsername }}</a>
          <p class="date">{{ formatDate(video.createdAt) }} • {{ video.views }} pregleda</p>
          <div class="tags" *ngIf="video.tags.length > 0">
            <span class="tag" *ngFor="let tag of video.tags">#{{ tag }}</span>
          </div>
        </div>
      </div>
    </div>

  </main>

</div>
